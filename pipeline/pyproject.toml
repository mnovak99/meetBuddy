[project]
name = "meeting-pipeline"
version = "0.1.0"
description = "Meeting Assistant pipeline: transcription, diarization, summary and Obsidian note."
requires-python = ">=3.12"
dependencies = [
    "mlx-whisper>=0.4.3",
    "numpy>=2.5.4",
    "pyannote-audio>=4.0",
]

[project.scripts]
meeting-pipeline = "meeting_pipeline.cli:main"

[build-system]
requires = ["uv_build>=0.8.3,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Slow tests need the real models and the Hugging Face token: `uv run pytest -m slow -s`.
addopts = "-m 'not slow'"
markers = ["slow: end-to-end run with the real models (Whisper, pyannote)"]
