# XcodeGen spec. Generate the Xcode project with `cd app && xcodegen generate`.
# Never edit MeetingAssistant.xcodeproj by hand, it is regenerated from this file.
name: MeetingAssistant

options:
  bundleIdPrefix: dev.matej
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "26.0"
    # Everything runs on the main thread unless marked otherwise (`nonisolated`).
    # Simpler to read; the app does only light work every few seconds.
    SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
    SWIFT_APPROACHABLE_CONCURRENCY: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    # Stable self-signed identity from the login keychain. Never ad-hoc ("-"):
    # macOS ties granted permissions (TCC) to the signing identity.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "MeetingAssistant Dev"
    DEVELOPMENT_TEAM: ""

targets:
  MeetingAssistant:
    type: application
    platform: macOS
    sources:
      - path: Sources
      - path: Resources
    info:
      path: Support/Info.plist
      properties:
        CFBundleName: Meeting Buddy
        CFBundleDisplayName: Meeting Buddy
        CFBundleShortVersionString: "0.4.0"
        CFBundleVersion: "1"
        CFBundleDevelopmentRegion: cs
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        LSApplicationCategoryType: public.app-category.productivity
        # Menu bar only: no Dock icon, no main menu.
        LSUIElement: true
        # Ask macOS to show notifications as persistent alerts instead of banners.
        # Not guaranteed for UserNotifications; the user can switch it in System Settings.
        NSUserNotificationAlertStyle: alert
        # Core Audio process tap: system prompt "Nahrávání systémového zvuku" on the first recording.
        NSAudioCaptureUsageDescription: "Meeting Buddy nahrává zvuk meeting aplikace (Teams, Google Meet, Discord) kvůli přepisu."
        # EventKit: title and participants of the current meeting.
        NSCalendarsFullAccessUsageDescription: "Meeting Buddy čte z Kalendáře název a účastníky právě probíhajícího meetingu."
        # The user's voice is recorded into mic.m4a (fixed device, microphoneName in config.json).
        NSMicrophoneUsageDescription: "Meeting Buddy nahrává tvůj hlas z mikrofonu (Arctis) do samostatné stopy, aby přepis věděl, co jsi řekl ty."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.matej.MeetingAssistant
        # The app is called Meeting Buddy; bundle ID, data folder and logs keep the original name,
        # so permissions and recordings carry over. The Swift module keeps its name for the tests.
        PRODUCT_NAME: MeetingBuddy
        PRODUCT_MODULE_NAME: MeetingAssistant
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        # Personal app: no sandbox (runs subprocesses, writes into the Obsidian vault),
        # no hardened runtime (not notarized, never distributed).
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: NO
        COMBINE_HIDPI_IMAGES: YES

  MeetingAssistantTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
    dependencies:
      - target: MeetingAssistant
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.matej.MeetingAssistantTests
        GENERATE_INFOPLIST_FILE: YES
        # Tests run inside the app process, so they can use its internal types.
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/MeetingBuddy.app/Contents/MacOS/MeetingBuddy"
        BUNDLE_LOADER: "$(TEST_HOST)"

schemes:
  MeetingAssistant:
    build:
      targets:
        MeetingAssistant: all
        MeetingAssistantTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MeetingAssistantTests
    archive:
      config: Release
