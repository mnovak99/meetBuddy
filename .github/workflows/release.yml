# Release button: Actions → Release → Run workflow.
# Runs on the self-hosted runner on the Mac mini (labels: self-hosted, macOS, meeting-buddy), so the
# app is signed with the local "MeetingAssistant Dev" identity; its key never leaves the Mac.
# If the Mac is off, the job waits in the queue until the runner is back.
name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Nová verze: patch (0.4.0 → 0.4.1), minor (→ 0.5.0), major (→ 1.0.0)"
        type: choice
        options: [patch, minor, major]
        default: patch
      draft:
        description: "Jen koncept (zveřejníš ručně na stránce Releases)"
        type: boolean
        default: false
      dry_run:
        description: "Jen zkouška: testy a build, nic se nevydá ani necommitne"
        type: boolean
        default: false

permissions:
  contents: write  # commit "Release X.Y.Z", tag, GitHub release

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: [self-hosted, macOS, meeting-buddy]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # all tags, for the version and the commit-based notes

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          BUMP: ${{ inputs.bump }}
          DRAFT: ${{ inputs.draft }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          # The runner does not get the login shell's PATH: uv, xcodegen, gh, ffmpeg.
          export PATH="$HOME/.local/bin:/opt/homebrew/bin:$PATH"
          if [ "$DRY_RUN" = true ]; then
            scripts/release.sh --dry-run
          elif [ "$DRAFT" = true ]; then
            scripts/release.sh --bump "$BUMP" --draft
          else
            scripts/release.sh --bump "$BUMP"
          fi

      - name: Keep the build
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v7
        with:
          name: MeetingBuddy-dry-run
          path: build/MeetingBuddy-*.zip
          retention-days: 3
